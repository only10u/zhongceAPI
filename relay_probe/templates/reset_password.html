{% extends "base.html" %}
{% block title %}重置密码{% endblock %}
{% block main %}
<div class="auth-page-landing" id="auth-page-only" data-auth-only="1" aria-hidden="true"></div>
<section class="card magic-card auth-reset-card">
  <h1 class="h1-magic gradient-text" data-i18n="reset_h1">重置密码</h1>
  <p class="small muted" data-i18n="reset_hint">通过邮件链接进入后，在这里设置新密码。</p>
  <form id="f-reset-password" class="auth-form auth-reset-form" autocomplete="off">
    <input type="hidden" name="token" id="reset-token" value="{{ reset_token or '' }}"/>
    <label class="auth-label"><span class="auth-l" data-i18n="f_pass">密码</span>
      <span class="auth-in-wrap">
        <input name="new_password" type="password" required minlength="8" autocomplete="new-password" class="auth-in"/>
      </span>
    </label>
    <button class="auth-submit auth-submit-primary" type="submit" data-i18n="reset_btn">保存新密码</button>
    <p id="reset-msg" class="auth-modal-msg" role="status" aria-live="polite"></p>
  </form>
</section>
{% endblock %}
